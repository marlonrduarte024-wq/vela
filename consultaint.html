<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Distrito | Consulta por Intervalos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: white; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
        /* Mantenemos tu estilo intacto */
        #main-content { padding: 20px; }
        .stat-card { background: #1e1e1e; border: 1px solid #333; border-radius: 10px; padding: 10px; text-align: center; cursor: default; height: 100%; display: flex; flex-direction: column; justify-content: center; }
        .stat-val { font-size: 1.3rem; font-weight: bold; display: block; word-break: break-all; }
        .stat-label { font-size: 0.65rem; color: #888; text-transform: uppercase; margin-top: 2px; }
        .pedido-card { border: none; border-left: 8px solid #444; margin-bottom: 15px; background-color: #1e1e1e; color: #e0e0e0; padding: 15px !important; }
        .estado-RECIBIDO { border-left-color: #ffc107 !important; }
        .estado-DESPACHADO { border-left-color: #0d6efd !important; }
        .estado-ENTREGADO { border-left-color: #198754 !important; opacity: 0.8; }
        .estado-CANCELADO { border-left-color: #dc3545 !important; opacity: 0.6; }
        .cliente-info { font-size: 1.2rem; font-weight: bold; color: #fff; text-transform: uppercase; margin-bottom: 5px; }
        .timeline-container { display: flex; flex-wrap: wrap; gap: 10px; background: #252525; padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; width: fit-content; margin-bottom: 10px; border: 1px solid #333; }
        .time-box { display: flex; align-items: center; gap: 4px; }
        .time-box.text-danger { color: #dc3545 !important; }
        .time-label { color: #888; font-size: 0.7rem; }
        .detalle-box { background: #151515; border-radius: 8px; padding: 12px; border: 1px solid #2a2a2a; margin-top: 10px; white-space: pre-wrap; word-wrap: break-word; }
        .detalle-texto { font-size: 1rem; color: #fff; line-height: 1.4; }
        .badge-pago { background-color: #333; color: #00ff88; border: 1px solid #00ff88; font-weight: bold; display: inline-block; }
        .info-local { font-size: 0.85rem; color: #bbb; }
        .modal-content { background-color: #1e1e1e; color: white; border: 1px solid #444; }
        .search-box { background: #1e1e1e; border: 1px solid #333; border-radius: 10px; padding: 12px; }
        .animate-pulse { animation: pulse-red 2s infinite; }
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(220, 53, 69, 0); } 100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); } }
    </style>
</head>
<body>

<div id="main-content" class="container-fluid">
    <div class="row mb-3 g-3">
        <div class="col-12 col-md-4 col-xl-3">
            <h2 class="mb-0">📊 Consultas</h2>
            <div class="small text-secondary mb-2" id="rango-actual-texto">Seleccione un rango de fechas</div>
            <div class="search-box">
                <div class="row g-2 align-items-center mb-2">
                    <div class="col">
                        <label class="form-label text-secondary m-0" style="font-size: 0.7rem; text-transform: uppercase;">Desde:</label>
                        <input type="date" id="fecha-inicio" class="form-control form-control-sm bg-dark text-white border-secondary">
                    </div>
                    <div class="col">
                        <label class="form-label text-secondary m-0" style="font-size: 0.7rem; text-transform: uppercase;">Hasta:</label>
                        <input type="date" id="fecha-fin" class="form-control form-control-sm bg-dark text-white border-secondary">
                    </div>
                    <div class="col-auto align-self-end">
                        
                        <button id="btn-consultar" onclick="consultarIntervalo()" class="btn btn-sm btn-info fw-bold text-dark px-3">🔍</button>
                    </div>
                </div>
                <div class="d-flex gap-2 align-items-center mb-2">
                    <span class="small text-secondary">👤</span>
                    <input type="text" id="input-buscar-cliente" oninput="filtrarPorNombre()" class="form-control form-control-sm bg-dark text-white border-secondary" placeholder="Filtrar por cliente...">
                </div>
                <button onclick="calcularProductosVendidos()" class="btn btn-sm btn-warning w-100 fw-bold text-dark">📊 PRODUCTOS VENDIDOS EN EL RANGO</button>
            </div>
        </div>

        <div class="col-12 col-md-8 col-xl-9">
            <div class="row g-2 mb-2 row-cols-2 row-cols-sm-4">
                <div class="col"><div class="stat-card border-warning"><span class="stat-val text-warning" id="count-pendientes">0</span><span class="stat-label">Pendientes</span></div></div>
                <div class="col"><div class="stat-card border-primary"><span class="stat-val text-primary" id="count-camino">0</span><span class="stat-label">En Camino</span></div></div>
                <div class="col"><div class="stat-card border-danger"><span class="stat-val text-danger" id="count-cancelados">0</span><span class="stat-label">Cancelados</span></div></div>
                <div class="col"><div class="stat-card border-success"><span class="stat-val text-success" id="count-entregados">0</span><span class="stat-label">Entregados</span></div></div>
            </div>
            <div class="row g-2 mb-2 row-cols-3">
                <div class="col"><div class="stat-card border-secondary"><span class="stat-val text-white" id="count-total">0</span><span class="stat-label">Total Pedidos</span></div></div>
                <div class="col"><div class="stat-card border-warning" style="background: #232015;"><span class="stat-val text-warning" id="count-domicilios">0 u</span><span class="stat-label">🛵 Domicilios</span></div></div>
                <div class="col"><div class="stat-card border-purple" style="background: #1a1523; border-color: #a855f7 !important;"><span class="stat-val" id="count-recoger" style="color: #a855f7;">0 u</span><span class="stat-label">🏬 Recoger</span></div></div>
            </div>
            <div class="row g-2 mb-2 row-cols-2">
                <div class="col"><div class="stat-card border-info" style="background: #141f27;"><span class="stat-val text-info" id="total-transferencia">$0</span><span class="stat-label">💵 Total Transferencia</span></div></div>
                <div class="col"><div class="stat-card border-light" style="background: #222;"><span class="stat-val text-light" id="total-efectivo">$0</span><span class="stat-label">💰 Total Efectivo</span></div></div>
            </div>
            <div class="row g-2"><div class="col-12"><div class="stat-card border-success" style="background: #112419; padding: 15px;"><span class="stat-val text-success" id="total-ventas" style="font-size: 1.8rem;">$0</span><span class="stat-label" style="font-size: 0.8rem; letter-spacing: 1px;">Total Ventas (Intervalo)</span></div></div></div>
        </div>
    </div>
    <div id="contenedor-pedidos" class="row"></div>
</div>

<div class="modal fade" id="modalComprobante" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Comprobante</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body p-0"><img id="img-comprobante" class="w-100"></div></div></div></div>
<div class="modal fade" id="modalProductosVendidos" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content p-3"><div class="d-flex justify-content-between mb-3"><h5 class="text-warning">📊 Ranking</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><table class="table table-dark table-striped"><tbody id="tabla-productos-cuerpo"></tbody></table></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_BASE = "https://nube.menwapp.com/api";
    let pedidosCache = [];
    let busquedaNombreActual = "";
    let filtroActual = "TODOS"; // Variable necesaria para tu dibujarPedidos

    window.onload = () => {
        const hoy = new Date().toLocaleString("en-US", {timeZone: "America/Bogota"}).split(',')[0].split('/');
        const fechaHoy = `${hoy[2]}-${hoy[0].padStart(2, '0')}-${hoy[1].padStart(2, '0')}`;
        document.getElementById('fecha-inicio').value = fechaHoy;
        document.getElementById('fecha-fin').value = fechaHoy;
    };

    // Función auxiliar para formato de hora
    function formatearH(h) { return (h || '--:--').substring(0,5); }

async function consultarIntervalo() {
    const btn = document.getElementById('btn-consultar');
    const textoEstado = document.getElementById('rango-actual-texto');
    const inicioStr = document.getElementById('fecha-inicio').value;
    const finStr = document.getElementById('fecha-fin').value;
    
    // Deshabilitar botón y mostrar estado
    btn.disabled = true;
    textoEstado.innerHTML = `<span class="text-warning">⏳ Iniciando consulta...</span>`;
    
    let fechaActual = new Date(inicioStr);
    let fechaFin = new Date(finStr);
    fechaActual.setMinutes(fechaActual.getMinutes() + fechaActual.getTimezoneOffset());
    fechaFin.setMinutes(fechaFin.getMinutes() + fechaFin.getTimezoneOffset());

    let todosLosPedidos = [];

    try {
        while (fechaActual <= fechaFin) {
            const fechaF = fechaActual.toISOString().split('T')[0];
            
            // Actualizamos el texto para mostrar qué día se está consultando
            textoEstado.innerText = `Consultando día: ${fechaF}...`;
            
            const response = await fetch(`${API_BASE}/obtener_pedidos?fecha=${fechaF}`);
            const data = await response.json();
            
            if (Array.isArray(data)) {
                todosLosPedidos = todosLosPedidos.concat(data);
            }
            
            fechaActual.setDate(fechaActual.getDate() + 1);
        }
        
        pedidosCache = todosLosPedidos;
        textoEstado.innerText = `Rango: ${inicioStr} al ${finStr} (${pedidosCache.length} pedidos)`;
        
        actualizarMétricas();
        dibujarPedidos();
        
    } catch (e) { 
        console.error(e);
        textoEstado.innerText = "Error en la consulta.";
        alert("Error al obtener los datos."); 
    } finally {
        btn.disabled = false; // Reactivamos el botón
    }
}

    function actualizarMétricas() {
        const validos = pedidosCache.filter(p => p.estado !== 'CANCELADO');
        document.getElementById('count-total').innerText = pedidosCache.length;
        document.getElementById('count-pendientes').innerText = pedidosCache.filter(p => p.estado === 'RECIBIDO').length;
        document.getElementById('count-camino').innerText = pedidosCache.filter(p => p.estado === 'DESPACHADO').length;
        document.getElementById('count-entregados').innerText = pedidosCache.filter(p => p.estado === 'ENTREGADO').length;
        document.getElementById('count-cancelados').innerText = pedidosCache.filter(p => p.estado === 'CANCELADO').length;
        
        let totalVentas = validos.reduce((acc, p) => acc + parseFloat(p.total || 0), 0);
        let transf = validos.filter(p => (p.metodo_pago || '').toLowerCase().includes('transferencia')).reduce((acc, p) => acc + parseFloat(p.total || 0), 0);
        
        document.getElementById('total-ventas').innerText = `$${totalVentas.toLocaleString()}`;
        document.getElementById('total-transferencia').innerText = `$${transf.toLocaleString()}`;
        document.getElementById('total-efectivo').innerText = `$${(totalVentas - transf).toLocaleString()}`;
        document.getElementById('count-domicilios').innerText = `${validos.length - validos.filter(p => (p.barrio || '').trim().toUpperCase() === 'LOCAL').length} u`;
        document.getElementById('count-recoger').innerText = `${validos.filter(p => (p.barrio || '').trim().toUpperCase() === 'LOCAL').length} u`;
    }

    function calcularProductosVendidos() {
        const conteo = {};
        pedidosCache.filter(p => p.estado !== 'CANCELADO').forEach(p => {
            (p.detalle_pedido || "").split('\n').forEach(linea => {
                const match = linea.match(/•\s*(\d+)\s*x\s*([^$]+)/i);
                if (match) {
                    const cant = parseInt(match[1]);
                    const prod = match[2].trim().toUpperCase();
                    if (cant > 0 && !prod.includes("TOTAL")) conteo[prod] = (conteo[prod] || 0) + cant;
                }
            });
        });
        const lista = Object.keys(conteo).map(n => ({n, c: conteo[n]})).sort((a,b) => b.c - a.c);
        document.getElementById('tabla-productos-cuerpo').innerHTML = lista.map((i, idx) => `<tr><td>${idx+1}</td><td>${i.n}</td><td class="text-end">${i.c} u</td></tr>`).join('');
        new bootstrap.Modal(document.getElementById('modalProductosVendidos')).show();
    }

    function verComprobante(id) { 
        document.getElementById('img-comprobante').src = `https://nube.menwapp.com/distrito/imagenes/pedido_${id}.jpg`;
        new bootstrap.Modal(document.getElementById('modalComprobante')).show(); 
    }

    function dibujarPedidos() {
        const contenedor = document.getElementById('contenedor-pedidos');
        contenedor.innerHTML = '';
        let filtrados = filtroActual === "TODOS" ? pedidosCache : pedidosCache.filter(p => p.estado === filtroActual);
        if (busquedaNombreActual !== "") filtrados = filtrados.filter(p => (p.cliente || '').toLowerCase().includes(busquedaNombreActual));

        filtrados.forEach(p => {
            const esTransferencia = (p.metodo_pago || '').toLowerCase().includes('transferencia');
            const esRecoger = (p.barrio || '').trim().toUpperCase() === 'LOCAL';
            const badgeEntrega = esRecoger ? `<span class="badge text-white border border-purple" style="background-color: #a855f7;">🏬 RECOGE LOCAL</span>` : `<span class="badge bg-dark text-white border border-warning">🛵 DOMICILIO</span>`;
            
            const div = document.createElement('div');
            div.className = "col-12 col-xxl-6 mb-3";
            div.innerHTML = `
                <div class="card pedido-card shadow estado-${p.estado}">
                    <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-2">
                        <div style="flex: 1; min-width: 200px;">
                            <div class="d-flex flex-wrap align-items-center gap-2 mb-1">
                                <span class="badge bg-dark border border-secondary text-info">#${p.id_pedido_local || '??'}</span>
                                <span class="badge bg-secondary" style="font-size:0.7rem">${p.estado || 'RECIBIDO'}</span>
                                ${badgeEntrega}
                            </div>
                            <div class="cliente-info">${(p.cliente || 'CLIENTE SIN NOMBRE').toUpperCase()}</div>
                            <div class="timeline-container">
                                <div class="time-box"><span class="time-label">RECIBIDO:</span> <b>${formatearH(p.hora_ingreso)}</b></div>
                                <div class="time-box text-primary"><span class="time-label text-primary">DESPACHO:</span> <b>${formatearH(p.hora_despacho)}</b></div>
                                <div class="time-box text-success"><span class="time-label text-success">ENTREGA:</span> <b>${formatearH(p.hora_entrega)}</b></div>
                            </div>
                        </div>
                        <div class="text-md-end text-start p-2 rounded" style="background: rgba(255,255,255,0.03); min-width: 130px; border: 1px solid #2a2a2a;">
                            <h3 class="text-success fw-bold mb-0" style="font-size: 1.6rem; word-break: break-all;">$${parseFloat(p.total || 0).toLocaleString()}</h3>
                            <span class="badge badge-pago px-2 py-1 mt-1" style="font-size: 0.75rem;">${(p.metodo_pago || 'EFECTIVO').toUpperCase()}</span>
                        </div>
                    </div>
                    <div class="row mt-2">
                        <div class="col-md-7">
                            <p class="mb-2 info-local"><strong class="text-warning">📍 Dirección:</strong> ${p.direccion || 'No especificada'}</p>
                            <p class="mb-2 info-local"><strong class="text-info">🏘️ Barrio:</strong> <span class="badge bg-dark text-white border border-info" style="font-size: 0.9rem;">${(p.barrio || 'SIN ESPECIFICAR').toUpperCase()}</span></p>
                            <div class="detalle-box"><div class="detalle-texto">${p.detalle_pedido || 'Sin detalles'}</div></div>
                        </div>
                        <div class="col-md-5 text-end d-flex flex-column justify-content-end gap-2 mt-3 mt-md-0">
                            ${esTransferencia ? `<button onclick="verComprobante(${p.id_pedido_local})" class="btn ${p.validado ? 'btn-outline-success' : 'btn-outline-danger animate-pulse'} btn-sm fw-bold py-2 w-100">${p.validado ? '✅ PAGO VALIDADO (VER)' : '⚠️ SIN VALIDAR (REVISAR)'}</button>` : ''}
                            <a href="${p.whatsapp_url || '#'}" target="_blank" class="btn btn-success btn-sm w-100 fw-bold py-2">📱 WHATSAPP</a>
                        </div>
                    </div>
                </div>`;
            contenedor.appendChild(div);
        });
    }

    function filtrarPorNombre() { busquedaNombreActual = document.getElementById('input-buscar-cliente').value.toLowerCase(); dibujarPedidos(); }
</script>
</body>
</html>
