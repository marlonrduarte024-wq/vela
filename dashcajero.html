<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vista Cajero | Monitor Distrito</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: white; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #121212; z-index: 9999; display: flex; justify-content: center; align-items: center; }
        #main-content { display: none; padding: 15px; }
        
        /* Tarjetas de Pedidos */
        .pedido-card { border: none; border-left: 8px solid #444; margin-bottom: 15px; background-color: #1e1e1e; color: #e0e0e0; padding: 15px !important; }
        .estado-RECIBIDO { border-left-color: #ffc107 !important; }
        .estado-DESPACHADO { border-left-color: #0d6efd !important; }
        .estado-ENTREGADO { border-left-color: #198754 !important; opacity: 0.85; }
        .estado-CANCELADO { border-left-color: #dc3545 !important; opacity: 0.6; }
        
        .cliente-info { font-size: 1.1rem; font-weight: bold; color: #fff; text-transform: uppercase; margin-bottom: 5px; }
        .timeline-container { display: flex; flex-wrap: wrap; gap: 8px; background: #252525; padding: 6px 10px; border-radius: 8px; font-size: 0.75rem; width: fit-content; margin-bottom: 10px; border: 1px solid #333; }
        .time-box { display: flex; align-items: center; gap: 4px; }
        .time-label { color: #888; font-size: 0.7rem; }
        .detalle-box { background: #151515; border-radius: 8px; padding: 10px; border: 1px solid #2a2a2a; margin-top: 8px; font-size: 0.9rem; white-space: pre-wrap; word-wrap: break-word; }
        .badge-pago { background-color: #333; color: #00ff88; border: 1px solid #00ff88; font-weight: bold; display: inline-block; }
        .info-local { font-size: 0.85rem; color: #bbb; }
        .modal-content { background-color: #1e1e1e; color: white; border: 1px solid #444; }
        .search-box { background: #1e1e1e; border: 1px solid #333; border-radius: 10px; padding: 12px; }
        
        .badge-tiempo { background-color: #2b2b2b; color: #ffca28; border: 1px solid #ffca28; font-size: 0.75rem; font-weight: bold; padding: 3px 8px; border-radius: 6px; }
        
        .animate-pulse { animation: pulse-red 2s infinite; }
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(220, 53, 69, 0); } 100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); } }

        /* Estilos para el Modo Dashboard (4 Columnas) */
        .grid-4-columnas { display: none; }
        
        body.mode-fullscreen .grid-normal { display: none !important; }
        body.mode-fullscreen .grid-4-columnas { display: flex !important; margin-top: 10px; }
        
        .kanban-col {
            background: #181818;
            border-radius: 10px;
            border: 1px solid #2c2c2c;
            padding: 12px;
            min-height: 80vh;
            max-height: 85vh;
            overflow-y: auto;
        }

        .kanban-header {
            position: sticky;
            top: 0;
            background: #181818;
            z-index: 10;
            padding-bottom: 10px;
            margin-bottom: 15px;
            border-bottom: 2px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .select-estado-card {
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            font-weight: bold;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

<div id="login-overlay">
    <div style="text-align: center; color: white; max-width: 300px; width: 90%;">
        <h3>🔐 Acceso Cajero</h3>
        <input type="password" id="pass-input" class="form-control bg-dark text-white border-secondary mb-2" placeholder="Contraseña">
        <button onclick="validarClave()" class="btn btn-primary w-100 fw-bold">INGRESAR</button>
    </div>
</div>

<div id="main-content" class="container-fluid">
    <!-- BARRA SUPERIOR Y FILTROS -->
    <div class="row mb-3 align-items-center g-2 search-box mx-0">
        <div class="col-12 col-md-2 d-flex align-items-center gap-2">
            <h4 class="mb-0 text-warning">📌 Monitor</h4>
            <span id="status-badge" class="badge bg-success p-1" style="font-size: 0.6rem;">ONLINE</span>
            <span id="contador-pedidos" class="badge bg-info text-dark font-monospace" style="font-size: 0.8rem;">0 pedidos</span>
        </div>
        
        <!-- Búsqueda Multicampo -->
        <div class="col-12 col-md-3">
            <input type="text" id="input-buscar" oninput="filtrarGlobal()" class="form-control form-control-sm bg-dark text-white border-secondary" placeholder="🔍 Buscar cliente, #pedido, barrio...">
        </div>

        <!-- Filtro por Estado (Rápido) -->
        <div class="col-12 col-md-3">
            <select id="select-filtro-estado" onchange="dibujarPedidos()" class="form-select form-select-sm bg-dark text-white border-secondary">
                <option value="TODOS">📋 Todos los pedidos</option>
                <option value="ACTIVOS" selected>⚡ Solo Activos (Pendientes)</option>
                <option value="LOCAL">🏬 Solo Recoge Local</option>
                <option value="TRANSFERENCIA_PENDIENTE">⚠️ Transferencias Sin Validar</option>
            </select>
        </div>

        <!-- Selector Fecha -->
        <div class="col-12 col-md-2">
            <div class="d-flex gap-1 align-items-center">
                <input type="date" id="input-fecha" class="form-control form-control-sm bg-dark text-white border-secondary">
                <button onclick="consultarFechaManual()" class="btn btn-sm btn-outline-info">🔍</button>
                <button onclick="volverHoy()" class="btn btn-sm btn-outline-secondary" title="Hoy">🔄</button>
            </div>
        </div>

        <!-- Botones de Utilidades -->
        <div class="col-12 col-md-2 d-flex gap-1 justify-content-end">
            <button onclick="toggleVista()" id="btn-tv" class="btn btn-outline-light btn-sm fw-bold w-50" title="Alternar Vista de Columnas">🖥️ Vista 4 Col</button>
            <button onclick="location.reload()" class="btn btn-outline-danger btn-sm fw-bold w-50">Salir</button>
        </div>
    </div>

    <!-- MODO VISTA NORMAL (CELULAR / LISTA UNICA) -->
    <div id="contenedor-pedidos" class="row grid-normal"></div>

    <!-- MODO VISTA COMPLETA 4 COLUMNAS (PC / TV) -->
    <div class="row g-2 grid-4-columnas">
        <!-- Columna 1: Pendientes -->
        <div class="col-12 col-md-3">
            <div class="kanban-col">
                <div class="kanban-header border-warning text-warning">
                    <h6 class="mb-0 fw-bold">⏳ PENDIENTES</h6>
                    <span id="cnt-recibido" class="badge bg-warning text-dark">0</span>
                </div>
                <div id="col-recibido"></div>
            </div>
        </div>
        <!-- Columna 2: Despachados -->
        <div class="col-12 col-md-3">
            <div class="kanban-col">
                <div class="kanban-header border-primary text-primary">
                    <h6 class="mb-0 fw-bold">🛵 DESPACHADOS</h6>
                    <span id="cnt-despachado" class="badge bg-primary">0</span>
                </div>
                <div id="col-despachado"></div>
            </div>
        </div>
        <!-- Columna 3: Entregados -->
        <div class="col-12 col-md-3">
            <div class="kanban-col">
                <div class="kanban-header border-success text-success">
                    <h6 class="mb-0 fw-bold">✅ ENTREGADOS</h6>
                    <span id="cnt-entregado" class="badge bg-success">0</span>
                </div>
                <div id="col-entregado"></div>
            </div>
        </div>
        <!-- Columna 4: Cancelados -->
        <div class="col-12 col-md-3">
            <div class="kanban-col">
                <div class="kanban-header border-danger text-danger">
                    <h6 class="mb-0 fw-bold">❌ CANCELADOS</h6>
                    <span id="cnt-cancelado" class="badge bg-danger">0</span>
                </div>
                <div id="col-cancelado"></div>
            </div>
        </div>
    </div>
</div>

<!-- MODAL COMPROBANTE DE PAGO -->
<div class="modal fade" id="modalComprobante" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-0"><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
            <div class="modal-body p-0"><img id="img-comprobante" class="w-100"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const CLAVE_SECRETA = "DISTRITO2026";
    const API_BASE = "https://nube.menwapp.com/api";
    let pedidosCache = [];
    let textoBusqueda = "";
    let conteoAnterior = 0;

    function validarClave() {
        if (document.getElementById('pass-input').value === CLAVE_SECRETA) {
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            cargarDatos();
            setInterval(cargarDatos, 10000);
        } else { 
            alert("Clave incorrecta"); 
        }
    }

    function obtenerFechaLocal() {
        const d = new Date(new Date().toLocaleString("en-US", {timeZone: "America/Bogota"}));
        return d.toISOString().split('T')[0];
    }

    async function cargarDatos(fechaTarget = null) {
        const fecha = fechaTarget || document.getElementById('input-fecha').value;
        try {
            const response = await fetch(`${API_BASE}/obtener_pedidos?fecha=${fecha}`);
            const data = await response.json() || [];
            
            if (conteoAnterior > 0 && data.length > conteoAnterior) {
                reproducirAlerta();
            }
            conteoAnterior = data.length;

            pedidosCache = data;
            dibujarPedidos();
        } catch (e) { console.error("Error API:", e); }
    }

    // NUEVA FUNCIÓN: Actualiza el estado en la base de datos
 // Actualiza el estado respetando el payload {"id": ..., "data": {...}} de tu API
async function cambiarEstado(idPedidoLocal, nuevoEstado) {
    try {
        const response = await fetch(`${API_BASE}/actualizar_pedido`, {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json' 
            },
            body: JSON.stringify({
                id: idPedidoLocal,
                data: {
                    estado: nuevoEstado
                }
            })
        });

        if (response.ok) {
            // Actualizamos la caché local inmediatamente para reflejar el cambio en la interfaz sin parpadeos
            const pedido = pedidosCache.find(p => p.id_pedido_local === idPedidoLocal);
            if (pedido) {
                pedido.estado = nuevoEstado;
            }
            dibujarPedidos();
        } else {
            const errorText = await response.text();
            console.error("Error respuesta servidor:", errorText);
            alert("Error al actualizar el estado en el servidor.");
        }
    } catch (e) {
        console.error("Error en actualizar_pedido:", e);
        alert("Ocurrió un fallo de conexión al cambiar el estado.");
    }
}

    function calcularTiempoTranscurrido(horaIngreso) {
        if (!horaIngreso || horaIngreso === "None" || horaIngreso === "null") return "";
        try {
            const ahora = new Date();
            let ingreso = new Date();
            
            if (horaIngreso.includes("T") || horaIngreso.includes("-")) {
                ingreso = new Date(horaIngreso);
            } else {
                const partes = horaIngreso.split(':');
                if (partes.length >= 2) {
                    ingreso.setHours(parseInt(partes[0]), parseInt(partes[1]), 0);
                }
            }

            const difMs = ahora - ingreso;
            const difMinutos = Math.floor(difMs / 60000);

            if (isNaN(difMinutos) || difMinutos < 0) return "";
            if (difMinutos === 0) return "⏱️ Hace instantes";
            return `⏱️ Hace ${difMinutos} min`;
        } catch (e) {
            return "";
        }
    }

    function generarHtmlTarjeta(p) {
        const esTransferencia = (p.metodo_pago || '').toLowerCase().includes('transferencia');
        const esRecoger = (p.barrio || '').trim().toUpperCase() === 'LOCAL';
        const badgeEntrega = esRecoger ? `<span class="badge text-white border border-purple" style="background-color: #a855f7;">🏬 RECOGE LOCAL</span>` : `<span class="badge bg-dark text-white border border-warning">🛵 DOMICILIO</span>`;
        const tiempoTranscurrido = calcularTiempoTranscurrido(p.hora_ingreso);
        const estActual = (p.estado || 'RECIBIDO').toUpperCase();
        
        return `
            <div class="card pedido-card shadow estado-${estActual}">
                <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-2">
                    <div style="flex: 1; min-width: 180px;">
                        <div class="d-flex flex-wrap align-items-center gap-2 mb-1">
                            <span class="badge bg-dark border border-secondary text-info">#${p.id_pedido_local || '??'}</span>
                            
                            <!-- Control de Cambio de Estado -->
                            <select onchange="cambiarEstado(${p.id_pedido_local}, this.value)" class="form-select form-select-sm select-estado-card py-0 px-2 d-inline-block style="width: auto;">
                                <option value="RECIBIDO" ${estActual === 'RECIBIDO' ? 'selected' : ''}>⏳ RECIBIDO</option>
                                <option value="DESPACHADO" ${estActual === 'DESPACHADO' ? 'selected' : ''}>🛵 DESPACHADO</option>
                                <option value="ENTREGADO" ${estActual === 'ENTREGADO' ? 'selected' : ''}>✅ ENTREGADO</option>
                                <option value="CANCELADO" ${estActual === 'CANCELADO' ? 'selected' : ''}>❌ CANCELADO</option>
                            </select>

                            ${badgeEntrega}
                            ${tiempoTranscurrido ? `<span class="badge-tiempo">${tiempoTranscurrido}</span>` : ''}
                        </div>
                        <div class="cliente-info">${(p.cliente || 'CLIENTE SIN NOMBRE').toUpperCase()}</div>
                        <div class="timeline-container">
                            <div class="time-box"><span class="time-label">RECIBIDO:</span> <b>${formatearH(p.hora_ingreso)}</b></div>
                            <div class="time-box text-primary"><span class="time-label text-primary">DESPACHO:</span> <b>${formatearH(p.hora_despacho)}</b></div>
                            <div class="time-box text-success"><span class="time-label text-success">ENTREGA:</span> <b>${formatearH(p.hora_entrega)}</b></div>
                        </div>
                    </div>
                    <div class="text-md-end text-start p-2 rounded" style="background: rgba(255,255,255,0.03); min-width: 120px; border: 1px solid #2a2a2a;">
                        <h3 class="text-success fw-bold mb-0" style="font-size: 1.4rem;">$${parseFloat(p.total || 0).toLocaleString()}</h3>
                        <span class="badge badge-pago px-2 py-1 mt-1" style="font-size: 0.75rem;">${(p.metodo_pago || 'EFECTIVO').toUpperCase()}</span>
                    </div>
                </div>
                <div class="row mt-2">
                    <div class="col-12 col-md-7">
                        <p class="mb-1 info-local"><strong class="text-warning">📍 Dirección:</strong> ${p.direccion || 'No especificada'}</p>
                        <p class="mb-1 info-local"><strong class="text-info">🏘️ Barrio:</strong> <span class="badge bg-dark text-white border border-info" style="font-size: 0.85rem;">${(p.barrio || 'SIN ESPECIFICAR').toUpperCase()}</span></p>
                        <div class="detalle-box"><div class="detalle-texto">${p.detalle_pedido || 'Sin detalles'}</div></div>
                    </div>
                    <div class="col-12 col-md-5 text-end d-flex flex-column justify-content-end gap-2 mt-2 mt-md-0">
                        ${esTransferencia ? `<button onclick="verComprobante(${p.id_pedido_local})" class="btn ${p.validado ? 'btn-outline-success' : 'btn-outline-danger animate-pulse'} btn-sm fw-bold py-2 w-100">${p.validado ? '✅ PAGO VALIDADO' : '⚠️ REVISAR PAGO'}</button>` : ''}
                        <a href="${p.whatsapp_url || '#'}" target="_blank" class="btn btn-success btn-sm w-100 fw-bold py-2">📱 WHATSAPP</a>
                    </div>
                </div>
            </div>`;
    }

    function dibujarPedidos() {
        const contenedorNormal = document.getElementById('contenedor-pedidos');
        contenedorNormal.innerHTML = '';

        const colRecibido = document.getElementById('col-recibido');
        const colDespachado = document.getElementById('col-despachado');
        const colEntregado = document.getElementById('col-entregado');
        const colCancelado = document.getElementById('col-cancelado');

        colRecibido.innerHTML = '';
        colDespachado.innerHTML = '';
        colEntregado.innerHTML = '';
        colCancelado.innerHTML = '';

        let counts = { RECIBIDO: 0, DESPACHADO: 0, ENTREGADO: 0, CANCELADO: 0 };
        const filtroEstado = document.getElementById('select-filtro-estado').value;
        
        let filtrados = pedidosCache.filter(p => {
            const q = textoBusqueda.toLowerCase();
            const matchTexto = (p.cliente || '').toLowerCase().includes(q) ||
                               (p.id_pedido_local || '').toString().includes(q) ||
                               (p.barrio || '').toLowerCase().includes(q) ||
                               (p.direccion || '').toLowerCase().includes(q);

            if (!matchTexto) return false;

            const est = (p.estado || 'RECIBIDO').toUpperCase();
            const esRecoger = (p.barrio || '').trim().toUpperCase() === 'LOCAL';
            const esTransf = (p.metodo_pago || '').toLowerCase().includes('transferencia');

            if (filtroEstado === 'ACTIVOS') return est === 'RECIBIDO' || est === 'DESPACHADO';
            if (filtroEstado === 'LOCAL') return esRecoger;
            if (filtroEstado === 'TRANSFERENCIA_PENDIENTE') return esTransf && !p.validado;

            return true;
        });

        document.getElementById('contador-pedidos').innerText = `${filtrados.length} pedido(s)`;

        filtrados.forEach(p => {
            const est = (p.estado || 'RECIBIDO').toUpperCase();
            if (counts[est] !== undefined) counts[est]++;

            const htmlCard = generarHtmlTarjeta(p);

            const divNormal = document.createElement('div');
            divNormal.className = "col-12 col-xxl-6 mb-3";
            divNormal.innerHTML = htmlCard;
            contenedorNormal.appendChild(divNormal);

            const divKanban = document.createElement('div');
            divKanban.className = "mb-2";
            divKanban.innerHTML = htmlCard;

            if (est === 'DESPACHADO') colDespachado.appendChild(divKanban);
            else if (est === 'ENTREGADO') colEntregado.appendChild(divKanban);
            else if (est === 'CANCELADO') colCancelado.appendChild(divKanban);
            else colRecibido.appendChild(divKanban);
        });

        document.getElementById('cnt-recibido').innerText = counts.RECIBIDO;
        document.getElementById('cnt-despachado').innerText = counts.DESPACHADO;
        document.getElementById('cnt-entregado').innerText = counts.ENTREGADO;
        document.getElementById('cnt-cancelado').innerText = counts.CANCELADO;
    }

    function formatearH(h) {
        if (!h || h === "None" || h === "null") return "--:--";
        if (h.length > 5) {
            const date = new Date(h);
            return !isNaN(date) ? date.toLocaleTimeString('es-CO', {hour: '2-digit', minute: '2-digit', hour12: false}) : "--:--";
        }
        return h;
    }

    function verComprobante(id) { 
        document.getElementById('img-comprobante').src = `https://nube.menwapp.com/distrito/imagenes/pedido_${id}.jpg`;
        new bootstrap.Modal(document.getElementById('modalComprobante')).show(); 
    }

    function reproducirAlerta() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            osc.connect(ctx.destination);
            osc.frequency.value = 440;
            osc.start();
            osc.stop(ctx.currentTime + 0.2);
        } catch(e){}
    }

    function toggleVista() {
        const body = document.body;
        const btn = document.getElementById('btn-tv');
        
        body.classList.toggle('mode-fullscreen');

        if (body.classList.contains('mode-fullscreen')) {
            btn.classList.replace('btn-outline-light', 'btn-warning');
        } else {
            btn.classList.replace('btn-warning', 'btn-outline-light');
        }
    }

    function consultarFechaManual() { cargarDatos(document.getElementById('input-fecha').value); }
    function volverHoy() { 
        document.getElementById('input-fecha').value = obtenerFechaLocal();
        cargarDatos(); 
    }
    function filtrarGlobal() { 
        textoBusqueda = document.getElementById('input-buscar').value; 
        dibujarPedidos(); 
    }

    window.onload = () => {
        document.getElementById('input-fecha').value = obtenerFechaLocal();
    };
</script>
</body>
</html>
